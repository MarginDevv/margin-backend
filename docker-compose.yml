services:
  postgres:
    image: postgres:16-alpine
    container_name: margin-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-margin}
      POSTGRES_USER: ${POSTGRES_USER:-margin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-margin}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-margin} -d ${POSTGRES_DB:-margin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: margin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: margin-api
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: margin-worker
    command: celery -A app.tasks.celery_app worker --loglevel=INFO --concurrency=4
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: margin-beat
    command: celery -A app.tasks.celery_app beat --loglevel=INFO
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Long-polling bot — for local dev and any deploy without a public HTTPS URL.
  # Skip this when running in webhook mode (TELEGRAM_BOT_MODE=webhook); the API
  # service handles inbound updates at /api/v1/webhooks/telegram/{secret}.
  bot:
    profiles: ["polling"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: margin-bot
    command: python -m app.bot
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # One-shot helper: registers TELEGRAM_WEBHOOK_URL with Telegram and exits.
  # Run only when needed:  docker compose run --rm bot-setup
  bot-setup:
    profiles: ["webhook-setup"]
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.bot setup-webhook
    env_file:
      - .env
    volumes:
      - ./:/app

volumes:
  postgres_data:
  redis_data:
