[tool.poetry]
name = "margin-backend"
version = "0.1.0"
description = "Margin — AI-manager for restaurants. Backend service."
authors = ["Margin Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.32" }
asyncpg = "^0.29.0"
alembic = "^1.13.2"
psycopg2-binary = "^2.9.9"
celery = { extras = ["redis"], version = "^5.4.0" }
redis = "^5.0.8"
httpx = "^0.27.0"
tenacity = "^9.0.0"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
python-multipart = "^0.0.9"
email-validator = "^2.2.0"
structlog = "^24.4.0"
orjson = "^3.10.7"
aiogram = "^3.13.0"
cryptography = "^43.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.3"
mypy = "^1.11.1"
pytest = "^8.3.2"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
factory-boy = "^3.3.1"
faker = "^28.0.0"
aiosqlite = "^0.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC"]
# B008: FastAPI/Pydantic patterns rely on default-arg expressions.
# N805: pydantic validators use `cls` as first arg.
# RUF001/2/3: ambiguous Cyrillic glyphs are intentional (Russian UI strings).
# UP037: keep PEP 563 quoted annotations explicit where we need them.
# UP042: SqlEnum(str, enum.Enum) is the documented SA pattern.
ignore = ["B008", "N805", "RUF001", "RUF002", "RUF003", "UP037", "UP042"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]
"tests/*" = ["B011", "E501", "N806"]

[tool.pylint.main]
ignore-paths = ["alembic"]
load-plugins = []
jobs = 0

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
# Conventions for this codebase:
# - We rely on type hints and FastAPI/Pydantic auto-docs instead of inline docstrings.
# - SQLAlchemy 2.0 ORM models and Pydantic schemas naturally have few public methods.
# - FastAPI endpoints and analytics queries take many keyword args by design.
# - Lazy imports inside functions break circular deps and speed startup.
# - We catch broad Exception in Celery wrappers and webhook handlers on purpose.
# - Duplicate-code triggers on similar SQLAlchemy column declarations across models.
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-instance-attributes",
    "too-many-statements",
    "too-many-branches",
    "too-many-return-statements",
    "import-outside-toplevel",
    "broad-exception-caught",
    "broad-exception-raised",
    "duplicate-code",
    "protected-access",
    "fixme",
    # SQLAlchemy 2.0 `func.*` namespace is dynamic; pylint can't introspect it.
    "not-callable",
    # pydantic-settings exposes `Field(...)` defaults that pylint mistakes for
    # FieldInfo instances at the class level.
    "no-member",
    # Module-level globals like `_bot`, `AsyncSessionLocal` follow SA / FastAPI
    # conventions — they're not true constants.
    "invalid-name",
    "global-statement",
]

[tool.pylint.design]
max-args = 12
max-attributes = 20
max-locals = 25

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["passlib.*", "jose.*", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/main.py", "alembic/*"]
