[tool.poetry]
name = "margin-backend"
version = "0.1.0"
description = "Margin — AI-manager for restaurants. Backend service."
authors = ["Margin Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.32" }
asyncpg = "^0.29.0"
alembic = "^1.13.2"
psycopg2-binary = "^2.9.9"
celery = { extras = ["redis"], version = "^5.4.0" }
redis = "^5.0.8"
httpx = "^0.27.0"
tenacity = "^9.0.0"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
# Pin bcrypt to <4 — passlib 1.7.4 has a known incompatibility with bcrypt 4.x:
# its backend introspection trips on the new "max 72 bytes" enforcement, so
# even short passwords fail with ValueError on hash(). Upstream tracking:
# https://github.com/pyca/bcrypt/issues/684 and passlib issue #190. When
# passlib 2.x stabilises this can be relaxed.
bcrypt = "<4.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
python-multipart = "^0.0.9"
email-validator = "^2.2.0"
structlog = "^24.4.0"
orjson = "^3.10.7"
aiogram = "^3.13.0"
cryptography = "^43.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.3"
mypy = "^1.11.1"
pytest = "^8.3.2"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
factory-boy = "^3.3.1"
faker = "^28.0.0"
aiosqlite = "^0.20.0"
pylint = "^4.0.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC"]
ignore = ["B008", "N805"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["passlib.*", "jose.*", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/main.py", "alembic/*"]

[tool.pylint.main]
# Match ruff's line length so the two linters don't disagree.
max-line-length = 100
# Don't try to import optional-dep packages just to introspect them.
ignore = ["alembic"]

[tool.pylint."messages control"]
# Disable rules that are noisy/redundant or fire only on framework patterns
# already covered by ruff + mypy.
disable = [
    # SQLAlchemy 2.x dynamic ``func.<name>`` — pylint can't see these attrs.
    "not-callable",
    # Pydantic / dataclass / SA models legitimately have few public methods.
    "too-few-public-methods",
    # Already enforced by ruff (E501).
    "line-too-long",
    # Already enforced by ruff (F401).
    "unused-import",
    # FastAPI / Pydantic patterns rely on many keyword args; thresholds here
    # generate noise without finding real issues.
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    # Lazy imports avoid circular-import cycles in this codebase by design.
    "import-outside-toplevel",
    # Docstrings: covered by class-level comments and type hints; enforcing
    # at every helper / dataclass field adds noise, not signal.
    "missing-function-docstring",
    "missing-module-docstring",
    "missing-class-docstring",
    # SQLAlchemy 2.x's canonical way to extract row->dict is ``row._mapping``.
    "protected-access",
    # Module-level singletons (FastAPI bot/dispatcher, async session factory)
    # use lower_case or PascalCase by convention.
    "invalid-name",
    # Singletons initialised on first webhook request require ``global``.
    "global-statement",
]

[tool.pylint.design]
max-args = 8
max-locals = 20
max-branches = 15

[tool.pylint.format]
max-line-length = 100
