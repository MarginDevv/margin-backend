name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      POETRY_VERSION: "1.8.3"
      POETRY_VIRTUALENVS_IN_PROJECT: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Ruff (lint)
        run: poetry run ruff check app tests

      - name: Ruff (format check)
        run: poetry run ruff format --check app tests

      - name: Mypy
        run: poetry run mypy app
        continue-on-error: true

      - name: Pylint (score gate)
        run: poetry run pylint app --fail-under=9.5

      - name: Pytest
        run: poetry run pytest -q
